# ============================================================================
# 纯概念股市场配置示例（仅虚拟证券，无任何实物物品）
#
# 使用方法（全新部署，默认全部开启）：
#   1. 把下方 markets: 段替换服务器上 qssuite-exchange 数据目录里的
#      markets.yml 对应内容（或把需要的条目合并进去）。
#   2. 确认插件 config.yml 里 enabled: true（默认是 false，不开不加载）。
#   3. 重启服务器。首次启动会自动为每个市场创建数据库行，并直接以
#      OPEN 状态开放市场与证券（enabled: true），无需逐个 resume。
#   4. 发行初始供应量，让玩家有股票可卖（每只一条，替换 <玩家UUID>）：
#        /qse admin stock issue ALPHA <玩家UUID> 5000 首发
#        /qse admin stock issue BETA <玩家UUID> 2000 首发
#        /qse admin stock issue GAMMA <玩家UUID> 10000 首发
#        /qse admin stock issue DELTA <玩家UUID> 3000 首发
#        /qse admin stock issue EPSLN <玩家UUID> 1000 首发
#        /qse admin stock issue ZETA <玩家UUID> 25000 首发
#        /qse admin stock issue ETA <玩家UUID> 750 首发
#        /qse admin stock issue THETA <玩家UUID> 4000 首发
#        /qse admin stock issue IOTA <玩家UUID> 50000 首发
#        /qse admin stock issue KAPPA <玩家UUID> 1250 首发
#        /qse admin stock issue LAMBDA <玩家UUID> 500 首发
#        /qse admin stock issue OMEGA <玩家UUID> 250 首发
#        /qse admin stock issue PIXEL <玩家UUID> 7500 首发
#        /qse admin stock issue NOVA <玩家UUID> 1750 首发
#        /qse admin stock issue MOON <玩家UUID> 250000 首发
#   5. 玩家即可在 /qse stocks 看到全部市场并开始交易。
#
# 重要：上线前先检查插件 config.yml 的 rollout 白名单——
#   rollout:
#     whitelist-enabled: true        # 保持 true 表示只允许下列玩家
#     allowed-players:               # 填入玩家 UUID（/qse 提示未在白名单）
#       - 00000000-0000-0000-0000-000000000000
#   若服务器没有现成的交易所用户体系，可临时设为 whitelist-enabled: false
#   再重启，所有玩家即可访问；正式运营建议保留白名单。
#
# 注意：若数据库里已存在之前用 enabled: false 创建的 CLOSED 行，改配置
# 不会改变已有状态，需要先执行一次 /qse admin stock resume <代码> 上线。
# 规则：min-quantity 必须是 minimum-unit 的整数倍（IOTA/MOON 因最小单位
# 为 10/100，min-quantity 已对应设为 10/100）。
#
# 设计说明：15 只股票覆盖不同"行业"与风险档位——
#   大盘稳健：ALPHA / DELTA / PIXEL / IOTA / GAMMA
#   成长中盘：BETA / NOVA / THETA / ZETA / KAPPA
#   稀缺高价：ETA / LAMBDA / OMEGA / EPSLN
#   高波动主题：MOON（Meme 币，仅供娱乐）
# ============================================================================
